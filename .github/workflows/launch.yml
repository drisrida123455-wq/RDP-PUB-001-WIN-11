name: Launch Private RDP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launch:
    runs-on: ubuntu-latest

    steps:

      - name: Trigger RDP-SEC-001-WIN-11
        env:
          PAT: ${{ secrets.PAT }}
        run: |
          set -e

          OWNER="drisrida123455-wq"
          REPO="RDP-SEC-001-WIN-11"
          WORKFLOW="rdp-secure.yml"

          echo "[+] Triggering private RDP workflow..."

          curl -fL \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $PAT" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/$OWNER/$REPO/actions/workflows/$WORKFLOW/dispatches" \
            -d '{"ref":"main"}'

          echo "[✓] Private RDP workflow triggered."
